{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Organizer Registration | CampusEvents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Organizer accent overrides */
        .logo-icon-wrapper {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4) !important;
        }
        .logo-highlight {
            color: #fcd34d !important;
        }
        .input-group label i {
            color: #fcd34d !important;
        }
        .input-group input:focus,
        .input-group select:focus {
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15) !important;
        }
        .login-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3) !important;
        }
        .login-btn:hover {
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5) !important;
        }
        .glow-1 {
            background: #f59e0b !important;
        }
        .signup-text a {
            color: #fcd34d !important;
        }
        .signup-text a:hover {
            color: #fde68a !important;
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Decorative Elements -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="login-card">

        <div class="logo">
            <div class="logo-icon-wrapper">
                <i class="fas fa-building"></i>
            </div>
            <span>Organizer <span class="logo-highlight">Registration</span></span>
        </div>

        <p class="subtitle">Create your organizer account to host events</p>

        {% for message in messages %}
            <div class="message {% if message.tags == 'success' %}message-success{% else %}message-error{% endif %}">
                <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
                {{ message }}
            </div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label><i class="fas fa-building"></i> Organization Name</label>
                <input type="text" name="organization_name" placeholder="Enter organization name" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-user"></i> Contact Person</label>
                <input type="text" name="contact_person" placeholder="Full name" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-phone"></i> Phone</label>
                <input type="text" name="phone" placeholder="Phone number" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-building-columns"></i> College</label>
                <select name="college" required>
                    <option value="">Select College</option>
                    {% for college in colleges %}
                        <option value="{{ college.id }}">{{ college.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-user-plus"></i> Register Organizer
            </button>
        </form>

        <p class="signup-text">
            Already have an account?
            <a href="{% url 'home' %}">Sign In</a>
        </p>

    </div>
</div>

</body>
</html>

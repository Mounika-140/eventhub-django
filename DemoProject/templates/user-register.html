{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration | CampusEvents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/user-register.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="register-container">
    <!-- Decorative Elements -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="register-card">

        <div class="logo">
            <div class="logo-icon-wrapper">
                <i class="fas fa-user-graduate"></i>
            </div>
            <span>Student <span class="logo-highlight">Registration</span></span>
        </div>

        <p class="subtitle">Create your student account to explore events</p>

        {% for message in messages %}
            <div class="message {% if message.tags == 'success' %}message-success{% else %}message-error{% endif %}">
                <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
                {{ message }}
            </div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-building-columns"></i> College</label>
                <select name="college" required>
                    <option value="">Select College</option>
                    {% for college in colleges %}
                        <option value="{{ college.id }}">{{ college.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="input-group">
                <label><i class="fas fa-flask"></i> Department</label>
                <input type="text" name="department" placeholder="e.g. Computer Science" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="register-btn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="{% url 'home' %}">Sign In</a>
        </p>

    </div>
</div>

</body>
</html>

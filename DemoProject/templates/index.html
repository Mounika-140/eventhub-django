{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | CampusEvents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="login-container">
    <!-- Decorative Elements -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="login-card">

        <div class="logo">
            <div class="logo-icon-wrapper">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <span>Campus<span class="logo-highlight">Events</span></span>
        </div>

        <p class="subtitle">Welcome back! Sign in to your account</p>

        {% for message in messages %}
            <div class="message {% if message.tags == 'success' %}message-success{% else %}message-error{% endif %}">
                <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
                {{ message }}
            </div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="divider">
            <span>or register as</span>
        </div>

        <div class="register-links">
            <a href="{% url 'student_register' %}" class="register-link student-link">
                <i class="fas fa-user-graduate"></i>
                <span>Student</span>
            </a>
            <a href="{% url 'organizer_register' %}" class="register-link organizer-link">
                <i class="fas fa-building"></i>
                <span>Organizer</span>
            </a>
        </div>

    </div>
</div>

</body>
</html>
